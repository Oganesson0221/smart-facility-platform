functions:
  facility_sop:
    _type: smart_facility_sop
  facility_object_detector:
    _type: smart_facility_object_detector
  facility_segmenter:
    _type: smart_facility_segmenter
  facility_scene_assessor:
    _type: smart_facility_scene_assessor
  facility_fire_exit_validator:
    _type: smart_facility_fire_exit_validator

llms:
  local_facility_llm:
    _type: openai
    # run-nemo-agent.sh points these at Switchyard when routing is enabled and
    # directly at Qwen when it is explicitly disabled.
    api_key: ${NAT_LLM_API_KEY:-EMPTY}
    base_url: ${NAT_LLM_BASE_URL:-http://127.0.0.1:4000/v1}
    model_name: ${NAT_LLM_MODEL:-switchyard/exitwatch-stage}
    temperature: 0.1

workflow:
  _type: tool_calling_agent
  llm_name: local_facility_llm
  tool_names:
    - facility_sop
    - facility_object_detector
    - facility_segmenter
    - facility_scene_assessor
    - facility_fire_exit_validator
  verbose: false
  # Surface tool failures to the HTTP client so an exception is never disguised
  # as a successful, empty assistant response.
  handle_tool_errors: false
  # Scene analysis can require detection followed by multimodal inspection;
  # leave enough room for tool results and one retry while retaining a hard cap.
  max_iterations: 8
  # These tools already return validated JSON. Bypass a second LLM pass so the
  # FastAPI client receives machine-readable payloads instead of paraphrased text.
  return_direct:
    - facility_object_detector
    - facility_segmenter
    - facility_scene_assessor
    - facility_fire_exit_validator

general:
  front_end:
    _type: fastapi
    host: 0.0.0.0
    port: 8010
    openai_api_v1_path: /v1/chat/completions
