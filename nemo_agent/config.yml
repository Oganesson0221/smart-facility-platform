functions:
  facility_sop:
    _type: smart_facility_sop
    sop_directory: ${SOP_DIRECTORY:-./sops}

llms:
  local_facility_llm:
    _type: openai
    api_key: ${LLM_API_KEY:-EMPTY}
    base_url: ${LLM_BASE_URL:-http://127.0.0.1:8001/v1}
    model_name: ${LLM_MODEL:-nvidia/NVIDIA-Nemotron-Nano-9B-v2}
    temperature: 0.1

workflow:
  _type: tool_calling_agent
  llm_name: local_facility_llm
  tool_names:
    - facility_sop
  verbose: false
  handle_tool_errors: true
  max_iterations: 4

general:
  front_end:
    _type: fastapi
    host: 0.0.0.0
    port: 8010
    openai_api_v1_path: /v1/chat/completions
