[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat"]

[project]
name = "nemo-agent-toolkit-smart-facility"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Local SOP tools for the Smart Facility NeMo Agent Toolkit workflow"
dependencies = [
  "nvidia-nat-core>=1.8,<2",
]

[project.entry-points."nat.plugins"]
nat_smart_facility = "nat.plugins.smart_facility.register"
